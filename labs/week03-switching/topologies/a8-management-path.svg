<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 969 902" width="969" height="902" role="img" aria-label="How a VLAN 99 frame reaches each switch's IP stack through br0.99"><style>
  .bg{fill:#ffffff}
  .box{fill:#f7f7f5;stroke:#3a3a38;stroke-width:1.4}
  .bridge{fill:#eceae5;stroke:#3a3a38;stroke-width:1.4}
  .wire{stroke:#3a3a38;stroke-width:1.4;fill:none}
  .self{stroke:#3a3a38;stroke-width:1.4;stroke-dasharray:6 4}
  .x line{stroke:#b4462e;stroke-width:2.2}
  text{font-family:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
       font-size:12.5px;fill:#26261f}
  .b{font-weight:700}
  .n{fill:#6c6a60;font-size:11.5px}
  @media (prefers-color-scheme:dark){
    .bg{fill:#16161a}
